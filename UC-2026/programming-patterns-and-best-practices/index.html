<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change in harvested wheat from 1997 to 2022</title>
    <link rel="icon" href="data:;base64,=" />
  </head>

  <body>
    <calcite-shell class="app-theme">
      <calcite-navigation slot="header">
        <calcite-navigation-logo
          heading-level="1"
          slot="logo"
          heading="Change in harvested wheat from 1997 to 2022"
          icon="presentation"
        ></calcite-navigation-logo>
      </calcite-navigation>

      <div class="main-container">
        <div class="map-container">
          <arcgis-map
            id="map"
            class="map"
            item-id="e8497cf46dfb4252a3f57e81cb611092"
            popup-component-enabled
          >
            <arcgis-zoom slot="top-left"></arcgis-zoom>
            <arcgis-expand slot="bottom-left">
              <arcgis-legend></arcgis-legend>
            </arcgis-expand>
            <arcgis-expand slot="top-right" mode="floating">
              <arcgis-placement>
                <calcite-panel class="states-list app-theme">
                  <calcite-list
                    id="stateList"
                    selection-mode="single-persist"
                    selection-appearance="border"
                  ></calcite-list>
                </calcite-panel>
              </arcgis-placement>
            </arcgis-expand>
          </arcgis-map>
        </div>

        <div class="with-chart-container">
          <arcgis-feature-table
            class="table"
            id="featureTable"
            reference-element="#map"
          ></arcgis-feature-table>
          <arcgis-chart class="chart" id="chart"></arcgis-chart>
        </div>
      </div>
    </calcite-shell>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
